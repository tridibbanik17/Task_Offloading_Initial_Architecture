0.75;" width="334.7021" x="743.25" y="369.9141"/><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="161.0684" x="830.0669" y="394.7139">mig_1 : Migration</text><line style="stroke:#181818;stroke-width:0.75;" x1="744.75" x2="1076.4521" y1="402.3281" y2="402.3281"/><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="211.6509" x="752.25" y="430.1279">node_id = "perception"</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="274.6611" x="752.25" y="456.542">source_location = "vehicle_1"</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="316.7021" x="752.25" y="482.9561">target_location = "edge_server_a"</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="204.5962" x="752.25" y="509.3701">status = "in_progress"</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="263.3101" x="752.25" y="535.7842">started_at = 1724873400.05</text></g><g id="elem_SNAP"><rect fill="#FFF9C4" height="176.4844" style="stroke:#181818;stroke-width:0.75;" width="318.3062" x="1011" y="930.9141"/><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="263.8638" x="1038.2212" y="955.7139">snapshot_7 : StateSnapshot</text><line style="stroke:#181818;stroke-width:0.75;" x1="1012.5" x2="1327.8062" y1="963.3281" y2="963.3281"/><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="103.3081" x="1020" y="991.1279">version = 7</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="182.6938" x="1020" y="1017.542">variables = &lt;bytes&gt;</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="283.1001" x="1020" y="1043.9561">buffered_messages = &lt;bytes&gt;</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="300.3062" x="1020" y="1070.3701">subscriptions = [ "/sensor/data" ]</text><text fill="#000000" font-family="Helvetica" font-size="21" lengthAdjust="spacing" textLength="266.7759" x="1020" y="1096.7842">timestamp = 1724873400.12</text></g><g id="elem_GMN18"><path d="M240,682.6641 L240,795.7734 A0,0 0 0 0 240,795.7734 L837.3809,795.7734 A0,0 0 0 0 837.3809,795.7734 L837.3809,697.6641 L822.3809,682.6641 L618.06,682.6641 L793.815,546.9591 L606.06,682.6641 L240,682.6641 A0,0 0 0 0 240,682.6641 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.75;"/><path d="M822.3809,682.6641 L822.3809,697.6641 L837.3809,697.6641 L822.3809,682.6641 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.75;"/><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="565.8809" x="249" y="710.4067">offloadable_node_1 and offloadable_node_2 are TWO OBJECTS</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="524.6147" x="249" y="734.9341">of the SAME class (OffloadableNode) with the same node_id</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="496.7549" x="249" y="759.4614">"perception". Neither stores "source"/"target" - those roles</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="488.814" x="249" y="783.9888">live only in mig_1. Next time the roles could be reversed.</text></g><g id="elem_GMN21"><path d="M1174.5,66.9141 L1174.5,253.6055 A0,0 0 0 0 1174.5,253.6055 L1461,253.6055 L1467,396.8091 L1473,253.6055 L1759.8838,253.6055 A0,0 0 0 0 1759.8838,253.6055 L1759.8838,81.9141 L1744.8838,66.9141 L1174.5,66.9141 A0,0 0 0 0 1174.5,66.9141 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.75;"/><path d="M1744.8838,66.9141 L1744.8838,81.9141 L1759.8838,81.9141 L1744.8838,66.9141 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.75;"/><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="128.959" x="1183.5" y="94.6567">In code (rclpy):</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="294.8328" x="1183.5" y="119.1841">- Sensor extends rclpy.node.Node</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="481.2444" x="1183.5" y="143.7114">- OffloadableNode extends rclpy.lifecycle.LifecycleNode</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="414.0132" x="1183.5" y="168.2388">lifecycle_state values are ROS2 lifecycle states:</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="350.1145" x="1183.5" y="192.7661">unconfigured / inactive / active / finalized</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="340.3359" x="1183.5" y="217.2935">(plus transition states, e.g. configuring).</text><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="553.8838" x="1183.5" y="241.8208">current_location is an open id (vehicle / edge / cloud / other DT).</text></g><!--link MGR to SRC--><g id="link_MGR_SRC"><path codeLine="70" d="M922.125,233.7141 C989.445,265.6941 1057.755,309.9891 1104,369.9141 C1169.925,455.3241 1184.8557,574.3084 1187.3457,654.4984 " fill="none" id="MGR-to-SRC" style="stroke:#181818;stroke-width:1.5;"/><polygon fill="#181818" points="1187.625,663.4941,1193.2031,649.8143,1187.3922,655.9977,1181.2089,650.1868,1187.625,663.4941" style="stroke:#181818;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="19.5" lengthAdjust="spacing" textLength="80.2185" x="1176" y="466.6567">manages</text></g><!--link MGR to TGT--><g id="link_MGR_TGT"><path codeLine="71" d="M478.845,167.0391 C276.585,185.4141 9,248.9